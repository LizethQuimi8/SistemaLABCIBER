server:
  port: 8084
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: administrative-logistics-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lici_admin}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:lici_user}
    password: ${DB_PASSWORD:lici_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

lici:
  security:
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/oauth2/jwks}
  storage:
    compras-dir: ${COMPRAS_STORAGE_DIR:/data/compras}
  services:
    # Usados por NotificacionClient para avisar del resultado de un prestamo:
    # al solicitante (document-service) y, para ubicar a los ADMINISTRADOR
    # cuando aprueba Admin. Infraestructura, el directorio (security-service).
    security-service-url: ${SECURITY_SERVICE_URL:http://localhost:8081}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
