server:
  port: 8081

spring:
  application:
    name: core-security-users-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lici_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:lici_user}
    password: ${DB_PASSWORD:lici_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

lici:
  jwt:
    issuer: ${JWT_ISSUER:http://core-security-users-service:8081}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  admin-seed:
    email: ${ADMIN_SEED_EMAIL:admin@espe.edu.ec}
    password: ${ADMIN_SEED_PASSWORD:Admin123*}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ec.edu.espe.lici: INFO
