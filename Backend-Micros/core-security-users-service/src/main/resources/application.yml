server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: core-security-users-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lici_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:lici_user}
    password: ${DB_PASSWORD:lici_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

lici:
  jwt:
    issuer: ${JWT_ISSUER:http://core-security-users-service:8081}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    key-id: ${JWT_KEY_ID:lici-auth-key-1}
  admin-seed:
    email: ${ADMIN_SEED_EMAIL:admin@espe.edu.ec}
    # Sin valor por defecto a proposito: el arranque debe fallar si no se define
    # explicitamente, en vez de crear el admin inicial con una clave adivinable.
    password: ${ADMIN_SEED_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ec.edu.espe.lici: INFO
